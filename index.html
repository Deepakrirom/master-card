<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>master card</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <span class="logo">
                <img src="mastercard-svgrepo-com.svg" alt="">
                <h5>Master Card</h5>
            </span>
            
            <img src="chip.png" class="chips">
            
        </header>

        <div class="card-details">
            <div class="name-number">
                <h6>Card Number</h6>
                <h4 class="number">8050 4050 5632 1234</h4>
                <h5 class="name">Vesper Kharibam</h5>
            </div>
            <div class="valid-date">
                <h6>Valid Sun</h6>
                <h5>12/28</h5>
            </div>
        </div>
    </div>
</body>
</html>
